<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0F1E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Gradecast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="See your grade, and what your next test will do to it, using your school's own letter cutoffs.">
<style>
/* Layout: one centered column (max 680px) of iOS-style inset grouped lists.
   The only color on screen is the grade color (green A -> red F); blue is reserved for things you can tap. */
:root{
  --bg:#F2F2F7;
  --cell:#FFFFFF;
  --fill:rgba(118,118,128,.12);
  --label:#000000;
  --label2:#6C6C70;
  --label3:#AEAEB2;
  --sep:rgba(60,60,67,.2);
  --tint:#0062D6;
  --danger:#D70015;
  --track:#E5E5EA;
  --bar:rgba(242,242,247,.82);
  --g-a:#34C759; --g-b:#9BCB3B; --g-c:#FFCC00; --g-d:#FF9500; --g-f:#FF3B30;
  --t-a:#1D7A33; --t-b:#4F7A0A; --t-c:#8A6500; --t-d:#B04F00; --t-f:#D70015;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --cell:#1C1C1E; --fill:rgba(118,118,128,.24); --label:#FFFFFF; --label2:#98989F; --label3:#636366;
    --sep:rgba(84,84,88,.6); --tint:#0A84FF; --danger:#FF453A; --track:#2C2C2E; --bar:rgba(0,0,0,.78);
    --g-a:#30D158; --g-b:#A8D84A; --g-c:#FFD60A; --g-d:#FF9F0A; --g-f:#FF453A;
    --t-a:#30D158; --t-b:#A8D84A; --t-c:#FFD60A; --t-d:#FF9F0A; --t-f:#FF453A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --fill:rgba(118,118,128,.24); --label:#FFFFFF; --label2:#98989F; --label3:#636366;
  --sep:rgba(84,84,88,.6); --tint:#0A84FF; --danger:#FF453A; --track:#2C2C2E; --bar:rgba(0,0,0,.78);
  --g-a:#30D158; --g-b:#A8D84A; --g-c:#FFD60A; --g-d:#FF9F0A; --g-f:#FF453A;
  --t-a:#30D158; --t-b:#A8D84A; --t-c:#FFD60A; --t-d:#FF9F0A; --t-f:#FF453A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.col{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* nav bar */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.navbar.scrolled{border-bottom-color:var(--sep)}
.navbar-in{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.navbar.scrolled .nav-title{opacity:1}
.bar-btn{display:inline-flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 4px;border:0;background:none;color:var(--tint);font-size:17px;text-decoration:none}
.bar-btn.strong{font-weight:600}
.bar-btn svg{width:22px;height:22px}
.bar-btn[disabled]{color:var(--label3);cursor:default}

main{padding-block:4px 64px}
.large-title{font:700 34px/1.12 var(--font-display);letter-spacing:.005em;padding:4px 0 2px;overflow-wrap:anywhere}
.subtitle{color:var(--label2);font-size:15px;margin-top:2px}

/* grouped lists */
.sec{margin-top:30px}
.sec-h{font-size:13px;line-height:1.3;font-weight:400;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:0 16px 7px}
.sec-f{font-size:13px;line-height:1.35;color:var(--label2);padding:7px 16px 0}
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;width:100%;border:0;background:none;text-align:left;text-decoration:none;color:inherit}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
a.row:active,button.row:active{background:var(--fill)}
@media (hover:hover){a.row:hover,button.row:hover{background:color-mix(in srgb,var(--fill) 55%,transparent)}}
.row-main{flex:1;min-width:0;display:grid;gap:1px}
.row-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:15px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-val{color:var(--label2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row-val.strong{color:var(--label)}
.chev{width:8px;height:14px;flex:none;color:var(--label3)}
.row.link{color:var(--tint)}
.row.destructive{color:var(--danger)}
.row.center{justify-content:center}
.row input.inline,.row select.inline{flex:0 1 auto;width:auto;min-width:0;max-width:60%;border:0;background:none;text-align:right;color:var(--label2);padding:0;font-size:17px;-webkit-appearance:none;appearance:none}
.row select.inline{padding-right:2px;cursor:pointer;color:var(--tint)}
.row input.inline:focus{outline:none;color:var(--label)}
.row input.inline::placeholder{color:var(--label3)}
.row input.full{max-width:none;width:100%;text-align:left;color:var(--label)}
.row label.row-label{flex:1;min-width:0}

/* grade ring */
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--track)}
.ring .prg{fill:none;stroke:var(--gc,var(--label3));stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.3,.7,.2,1),stroke .3s}
.ring-sm{width:40px;height:40px}
.ring-sm .ltr{font:700 13px/1 var(--font-round);color:var(--tc,var(--label2))}
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 0 4px}
.ring-lg{width:200px;height:200px}
.ring-lg .inner{display:grid;justify-items:center;gap:2px;position:relative}
.ring-lg .pct{font:700 40px/1 var(--font-round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring-lg .pct small{font-size:22px;font-weight:600;margin-left:1px}
.ring-lg .ltr{font:600 20px/1.2 var(--font-round);color:var(--tc,var(--label2))}
.hero-note{font-size:15px;color:var(--label2);text-align:center}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.ring-lg .prg.intro{animation:ringIn .9s cubic-bezier(.3,.7,.2,1) both}

/* what-if card */
.wi{padding:14px 16px 16px;position:relative}
.wi::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.wi-score{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wi-score .val{font:600 22px/1 var(--font-round);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.wi-score .val input{width:3.4em;border:0;background:var(--fill);border-radius:8px;padding:6px 8px;text-align:right;font:inherit}
.wi-score .val .of{color:var(--label2);font-weight:500}
.slider{-webkit-appearance:none;appearance:none;position:relative;display:block;width:100%;height:36px;margin:0;background:transparent;cursor:pointer}
.slider::-webkit-slider-runnable-track{height:6px;background:transparent}
.slider::-moz-range-track{height:6px;background:transparent}
.slider::-moz-range-progress{background:transparent}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#FFFFFF;margin-top:-11px;box-shadow:0 .5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.slider::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#FFFFFF;box-shadow:0 .5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12)}
.wi-result{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;margin-top:6px;border-top:.5px solid var(--sep)}
.wi-new{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;font-variant-numeric:tabular-nums}
.wi-new .p{font:700 28px/1 var(--font-round);letter-spacing:-.01em}
.wi-new .l{font:600 20px/1 var(--font-round);color:var(--tc)}
.wi-delta{font-size:15px;color:var(--label2);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.wi-need{margin-top:12px;display:grid;gap:4px;font-size:15px;color:var(--label2)}
.wi-need b{color:var(--label);font-weight:600;font-variant-numeric:tabular-nums}

.tc{color:var(--tc)}
.strike .row-title,.strike .row-val{text-decoration:line-through;opacity:.55}
.empty{padding:28px 20px;text-align:center;display:grid;gap:6px;justify-items:center}
.empty p{color:var(--label2);font-size:15px;max-width:34ch}
.notice{font-size:15px;color:var(--label2);padding:6px 16px;background:var(--cell);border-radius:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
.notice button{border:0;background:none;color:var(--tint);font-size:15px;padding:4px 0;min-height:36px}

/* scale table */
.band-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 72px 32px;gap:8px;align-items:center}
.band-row input{width:100%;min-width:0;border:0;background:var(--fill);border-radius:8px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
.band-row input.ltr-in{text-align:left;font-weight:600;background:none;padding-left:0}
.band-head{font-size:13px;color:var(--label2);min-height:36px;padding-block:8px}
.band-head span:nth-child(2),.band-head span:nth-child(3){text-align:right;padding-right:8px}
.minus{display:grid;place-items:center;width:32px;height:32px;border:0;background:none;color:var(--label3);font-size:22px;line-height:1;border-radius:50%}
.minus:hover,.minus:focus-visible{background:var(--fill);color:var(--danger)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gc,var(--label3));flex:none}

/* sheets */
#sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fade .2s ease}
.sheet-panel{position:relative;width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--bg);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.sheet-bar{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 12px;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep)}
.sheet-bar h2{font-size:17px;font-weight:600;text-align:center;white-space:nowrap}
.sheet-bar>:last-child{justify-self:end}
.sheet-body{padding:0 16px 28px}
.sheet-body .sec:first-child{margin-top:20px}
.grabber{display:none}
@media (max-width:600px){
  #sheet{place-items:end center}
  .sheet-panel{width:100%;max-height:94%;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .grabber{display:block;position:absolute;top:5px;left:50%;transform:translateX(-50%);width:36px;height:5px;border-radius:3px;background:var(--label3);z-index:3}
  .sheet-bar{padding-top:12px}
}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;width:100%}
.seg label{flex:1;text-align:center;padding:6px 8px;border-radius:7px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--cell);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--tint)}
.err{color:var(--danger);font-size:13px;padding:8px 16px 0}
.err:empty{display:none}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 32px;gap:8px;align-items:center}
.cat-row input{width:100%;min-width:0;border:0;background:none;padding:2px 0}
.cat-row input:focus{outline:none}
.cat-row input.w{background:var(--fill);border-radius:8px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
form[data-method="points"] .w,form[data-method="points"] .w-only{display:none}
form[data-method="points"] .cat-row{grid-template-columns:minmax(0,1fr) 32px}
textarea.paste{display:block;width:100%;min-height:150px;border:0;background:var(--cell);border-radius:12px;padding:12px 16px;font:14px/1.45 ui-monospace,"SF Mono",Menlo,monospace;resize:vertical}

/* alert */
.alert{position:relative;width:min(290px,calc(100% - 48px));background:var(--cell);border-radius:14px;overflow:hidden;text-align:center;animation:pop .2s ease}
.alert-body{padding:20px 16px 18px}
.alert h2{font-size:17px;font-weight:600}
.alert p{font-size:13px;margin-top:4px}
.alert-btns{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep)}
.alert-btns button{border:0;background:none;min-height:44px;color:var(--tint);font-size:17px}
.alert-btns button+button{border-left:.5px solid var(--sep)}
.alert-btns .destructive{color:var(--danger);font-weight:600}

/* blackbaud */
.steps{margin:0;padding:12px 16px 14px 36px;display:grid;gap:8px;font-size:15px;line-height:1.4}
.steps li::marker{color:var(--label2)}
.bm{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:7px 14px;border-radius:999px;background:var(--fill);color:var(--label);font-weight:600;font-size:15px;text-decoration:none;cursor:grab;user-select:none}
.bm::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g-a)}
.bb-diff{font-size:13px;color:var(--label2);text-align:center;max-width:32ch}
.welcome{display:grid;justify-items:center;text-align:center;padding-top:28px}
.welcome .large-title{padding-top:14px}
.welcome p.tag{color:var(--label2);font-size:17px;margin-top:6px;max-width:30ch}
.welcome .sec{width:100%;text-align:left}
.lead{font-size:15px;color:var(--label2);padding:16px 4px 0;line-height:1.45}
/* motion + live visuals */
.bar-btn:active{opacity:.4}
.ring .prg.intro{animation:ringIn .8s cubic-bezier(.3,.7,.2,1) both;animation-delay:var(--d,0s)}
.ring-lg .prg{transition:stroke-dashoffset .9s cubic-bezier(.25,.8,.25,1),stroke .35s}
.ring-lg.live .prg{transition:stroke-dashoffset .14s ease-out,stroke .2s}
.ring-lg .ghost{fill:var(--label);opacity:0;transition:opacity .2s}
.ring-lg.preview .ghost{opacity:.4}
.ring-lg .ltr{display:inline-block;transition:color .25s}
.pop{animation:ltrPop .34s cubic-bezier(.3,1.7,.5,1)}
@keyframes ltrPop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.hero-note{min-height:1.35em;transition:color .2s}
.hero-note.preview{color:var(--label)}
.wi-new .l{display:inline-block}
.track-wrap{position:relative;height:36px;margin-top:10px}
.zones{position:absolute;left:14px;right:14px;top:50%;height:6px;margin-top:-3px;border-radius:3px;overflow:hidden;display:flex;opacity:.25;pointer-events:none}
.zones span{height:100%;flex:none;box-sizing:border-box}
.zones span+span{border-left:2px solid var(--cell)}
.zones.fillz{opacity:1;clip-path:inset(0 var(--clip,100%) 0 0)}
.zone-labels{position:relative;height:16px;margin:0 14px 2px}
.zone-labels span{position:absolute;top:0;transform:translateX(-50%);font:600 11px/16px var(--font-round);color:var(--tc);white-space:nowrap}
.row.cat-item{display:block}
.catbar{height:4px;border-radius:2px;background:var(--track);overflow:hidden;margin-top:8px}
.catbar i{display:block;height:100%;width:0;border-radius:2px;background:var(--gc,var(--label3));transition:width .7s cubic-bezier(.25,.8,.25,1),background-color .25s}
.view-fwd{animation:pushIn .34s cubic-bezier(.2,.8,.2,1)}
.view-back{animation:popIn .34s cubic-bezier(.2,.8,.2,1)}
@keyframes pushIn{from{opacity:0;transform:translateX(28px)}}
@keyframes popIn{from{opacity:0;transform:translateX(-28px)}}
.sheet-bar{touch-action:none}
#sheet.closing .sheet-panel{animation:sink .22s ease-in forwards}
#sheet.closing .alert,#sheet.closing .sheet-backdrop{animation:fadeOut .2s ease-in forwards}
@keyframes sink{to{transform:translateY(110%)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
@keyframes pop{from{transform:scale(1.08);opacity:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (prefers-reduced-transparency: reduce){:root{--bar:var(--bg)}}
</style>

<header class="navbar" id="navbar"><div class="col navbar-in" id="navbar-in"></div></header>
<main id="main" class="col"></main>
<div id="sheet" hidden></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Math.random().toString(36).slice(2, 10); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function num(v){ if (v === '' || v == null) return null; var n = parseFloat(v); return isFinite(n) ? n : null; }
function fmt(n, d){ if (d == null) d = 2; return (n == null || !isFinite(n)) ? '—' : n.toFixed(d); }
function pts(n){ if (n == null || !isFinite(n)) return '—'; return String(Math.round(n * 100) / 100); }
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){ if (!d) return ''; var p = String(d).split('-'); if (p.length < 3) return d; return MONTHS[(+p[1]) - 1] + ' ' + (+p[2]); }
function todayISO(){ var t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
var CHEV = '<svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5L6.5 7l-5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var BACK = '<svg viewBox="0 0 12 22" style="width:12px;height:21px" aria-hidden="true"><path d="M10 2L2 11l8 9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- grading scale ---------- */
function mk(arr){ return arr.map(function(b){ return { letter:b[0], min:b[1], gpa:b[2] }; }); }
var PRESETS = {
  draft:   { name:'My school (draft)', rounding:'none', bands: mk([['A',92.5,4],['A-',89.5,3.7],['B+',86.5,3.3],['B',82.5,3],['B-',79.5,2.7],['C+',76.5,2.3],['C',72.5,2],['C-',69.5,1.7],['D+',66.5,1.3],['D',62.5,1],['D-',59.5,0.7],['F',0,0]]) },
  standard:{ name:'Standard plus/minus', rounding:'none', bands: mk([['A',93,4],['A-',90,3.7],['B+',87,3.3],['B',83,3],['B-',80,2.7],['C+',77,2.3],['C',73,2],['C-',70,1.7],['D+',67,1.3],['D',63,1],['D-',60,0.7],['F',0,0]]) },
  ten:     { name:'10-point (90/80/70/60)', rounding:'none', bands: mk([['A',90,4],['B',80,3],['C',70,2],['D',60,1],['F',0,0]]) },
  seven:   { name:'7-point (93/85/77/70)', rounding:'none', bands: mk([['A',93,4],['B',85,3],['C',77,2],['D',70,1],['F',0,0]]) }
};
var ROUNDING = { none:'None', whole:'Whole number', tenth:'One decimal' };

function applyRound(p, mode){
  if (p == null) return null;
  if (mode === 'whole') return Math.floor(p + 0.5 + 1e-9);
  if (mode === 'tenth') return Math.floor(p * 10 + 0.5 + 1e-9) / 10;
  return p;
}
function effCut(min, mode){
  if (mode === 'whole') return Math.ceil(min - 1e-9) - 0.5;
  if (mode === 'tenth') return Math.ceil(min * 10 - 1e-9) / 10 - 0.05;
  return min;
}
function bandsDesc(scale){ return scale.bands.slice().sort(function(a, b){ return (+b.min) - (+a.min); }); }
function letterOf(p, scale){
  if (p == null) return null;
  var r = applyRound(p, scale.rounding), bands = bandsDesc(scale);
  for (var i = 0; i < bands.length; i++) if (r >= (+bands[i].min) - 1e-9) return bands[i];
  return bands[bands.length - 1] || null;
}
function gkey(letter){ var c = String(letter || '').trim().charAt(0).toUpperCase(); return ({A:'a',B:'b',C:'c',D:'d',F:'f',E:'f'})[c] || null; }
function gstyle(letter){ var k = gkey(letter); return k ? '--gc:var(--g-' + k + ');--tc:var(--t-' + k + ')' : ''; }
function standing(pct, scale){
  var bands = bandsDesc(scale), b = letterOf(pct, scale), i = bands.indexOf(b);
  var up = i > 0 ? bands[i - 1] : null;
  return { band:b, up:up, toUp: up ? effCut(+up.min, scale.rounding) - pct : null,
    cushion: (b && +b.min > 0 && i < bands.length - 1) ? pct - effCut(+b.min, scale.rounding) : null };
}

/* ---------- grade math ---------- */
function counted(a){
  if (a.status === 'missing') return num(a.possible) != null;
  if (a.status === 'excused' || a.status === 'pending') return false;
  return num(a.earned) != null && num(a.possible) != null;
}
function scoreOf(a){ return a.status === 'missing' ? 0 : (num(a.earned) || 0); }
function keptItems(items, cat){
  var n = Math.max(0, parseInt(cat && cat.drop, 10) || 0);
  if (!n) return { kept: items, dropped: [] };
  var scored = items.filter(function(a){ return num(a.possible) > 0; });
  if (scored.length <= n) return { kept: items, dropped: [] };
  var drop = scored.slice().sort(function(a, b){ return scoreOf(a) / num(a.possible) - scoreOf(b) / num(b.possible); }).slice(0, n);
  return { kept: items.filter(function(a){ return drop.indexOf(a) < 0; }), dropped: drop };
}
function compute(cls){
  var cats = cls.categories && cls.categories.length ? cls.categories : [{ id:'_all', name:'All work', weight:100, drop:0 }];
  var ids = {}; cats.forEach(function(c){ ids[c.id] = []; });
  cls.assignments.forEach(function(a){ if (counted(a)) (ids[a.catId] || ids[cats[0].id]).push(a); });
  var dropped = {}, rows = [], E = 0, P = 0;
  cats.forEach(function(c){
    var k = keptItems(ids[c.id], c), e = 0, p = 0;
    k.dropped.forEach(function(a){ dropped[a.id] = true; });
    k.kept.forEach(function(a){ e += scoreOf(a); p += num(a.possible) || 0; });
    rows.push({ cat:c, E:e, P:p, pct: p > 0 ? e / p * 100 : null, n: k.kept.length });
    E += e; P += p;
  });
  var pct = null;
  if (cls.method === 'points') pct = P > 0 ? E / P * 100 : null;
  else {
    var sw = 0, acc = 0;
    rows.forEach(function(r){ if (r.pct == null) return; var w = +r.cat.weight || 0; sw += w; acc += w * r.pct; });
    pct = sw > 0 ? acc / sw : null;
  }
  return { pct:pct, rows:rows, dropped:dropped };
}
function pctWith(cls, extra){ return compute(Object.assign({}, cls, { assignments: cls.assignments.concat([extra]) })).pct; }
function needFor(cls, scale, catId, possible, band){
  var cut = effCut(+band.min, scale.rounding);
  var test = function(s){ var p = pctWith(cls, { id:'_sim', catId:catId, earned:s, possible:possible, status:'graded' }); return p != null && p >= cut - 1e-9; };
  if (test(0)) return 0;
  var lim = Math.max(possible, 1) * 10;
  if (!test(lim)) return Infinity;
  var lo = 0, hi = lim;
  for (var i = 0; i < 50; i++) { var m = (lo + hi) / 2; if (test(m)) hi = m; else lo = m; }
  return Math.ceil(hi * 100 - 1e-6) / 100;
}

function freshState(withExamples){

function valid(s){ return s && Array.isArray(s.classes) && Array.isArray(s.scales) && s.scales.length > 0; }
function normalize(s){
  if (!s.gpa) s.gpa = { honors:0.5, ap:1.0 };
  if (s.onboarded === undefined) s.onboarded = !!(s.example || s.classes.length);
  if (!s.scales.some(function(x){ return x.id === s.defaultScaleId; })) s.defaultScaleId = s.scales[0].id;
  s.classes.forEach(function(c){ c.categories = c.categories || []; c.assignments = c.assignments || []; c.method = c.method || 'weighted'; c.level = c.level || 'regular'; });
  return s;
}
function load(){
  try { var raw = localStorage.getItem(KEY); if (raw) { var s = JSON.parse(raw); if (valid(s)) return normalize(s); } } catch (e) {}
  return freshState(false);
}

function scale(){ return state.scales.find(function(s){ return s.id === state.defaultScaleId; }) || state.scales[0]; }
function getClass(id){ return state.classes.find(function(c){ return c.id === id; }); }
function gpaSummary(){
  var uw = 0, w = 0, n = 0, sc = scale();
  state.classes.forEach(function(c){
    var p = compute(c).pct; if (p == null) return;
    var g = +letterOf(p, sc).gpa || 0;
    var boost = g > 0 ? (c.level === 'ap' ? +state.gpa.ap || 0 : c.level === 'honors' ? +state.gpa.honors || 0 : 0) : 0;
    uw += g; w += g + boost; n++;
  });
  return n ? { uw: uw / n, w: w / n, n:n } : null;
}

/* ---------- pieces ---------- */
function ringSm(pct, band, delay){
  var r = 16, C = 2 * Math.PI * r, f = pct == null ? 0 : Math.max(0, Math.min(100, pct)) / 100;
  return '<span class="ring ring-sm" style="' + gstyle(band && band.letter) + '"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="trk" cx="20" cy="20" r="' + r + '" stroke-width="4"/>' +
    '<circle class="prg' + (delay != null ? ' intro' : '') + '" cx="20" cy="20" r="' + r + '" stroke-width="4" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - f)).toFixed(2) + '" style="--c:' + C.toFixed(2) + ';--d:' + (delay || 0) + 's"/></svg>' +
    '<span class="ltr">' + esc(band ? band.letter : '–') + '</span></span>';
}
function ringLg(pct, band, from){
  var r = 88, C = 2 * Math.PI * r, shown = pct == null ? 0 : from;
  var f = Math.max(0, Math.min(100, shown)) / 100, fa = pct == null ? 0 : Math.max(0, Math.min(100, pct)) / 100;
  var th = 2 * Math.PI * fa, gx = (100 + r * Math.cos(th)).toFixed(2), gy = (100 + r * Math.sin(th)).toFixed(2);
  return '<div class="ring ring-lg" id="hero-ring" data-c="' + C.toFixed(3) + '" style="' + gstyle(band && band.letter) + '" role="img" aria-label="' + (pct == null ? 'No grade yet' : fmt(pct) + ' percent, ' + esc(band.letter)) + '">' +
    '<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="' + r + '" stroke-width="18"/>' +
    '<circle class="prg" id="hero-prg" cx="100" cy="100" r="' + r + '" stroke-width="18" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - f)).toFixed(2) + '"/>' +
    '<circle class="ghost" cx="' + gx + '" cy="' + gy + '" r="4.5"/></svg>' +
    '<div class="inner"><span class="pct">' + (pct == null ? '—' : '<span id="hero-num">' + fmt(shown) + '</span><small>%</small>') + '</span><span class="ltr" id="hero-ltr">' + esc(band ? band.letter : 'No grades yet') + '</span></div></div>';
}

  if (!s) {
    var guess = cls.categories.find(function(c){ return /test|exam|assess|summative/i.test(c.name); }) || cls.categories[0];
    s = ui.sim[cls.id] = { catId: guess ? guess.id : null, possible:100, score:90 };
  }
  if (cls.categories.length && !cls.categories.some(function(c){ return c.id === s.catId; })) s.catId = cls.categories[0].id;
  return s;
}

var DATE_RE = /\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/;
function parsePaste(text, cls){
  var out = [], cats = cls.categories.slice().sort(function(a, b){ return b.name.length - a.name.length; });
  String(text || '').split(/\r?\n/).forEach(function(raw){
    var line = raw.trim(); if (!line) return;
    var date = '', dm = line.match(DATE_RE);
    if (dm) { var y = +dm[3]; if (y < 100) y += 2000; date = y + '-' + String(dm[1]).padStart(2, '0') + '-' + String(dm[2]).padStart(2, '0'); line = line.replace(DATE_RE, ' '); }

    while ((m = re.exec(line))) last = m;
    var status = 'graded', earned = null, possible = null;
    if (/\bmissing\b/i.test(line)) status = 'missing';
    else if (/\b(excused|exempt)\b/i.test(line)) status = 'excused';
    else if (/not graded|ungraded/i.test(line)) status = 'pending';
    if (last) { earned = +last[1]; possible = +last[2]; }
    else {
      var pm = line.match(/(?:^|\s)(?:\/|out of)\s*(\d+(?:\.\d+)?)/i) || line.match(/(\d+(?:\.\d+)?)\s*(?:pts|points)?\s*possible/i);
      if (pm) possible = +pm[1];
      if (possible == null || status === 'graded') return;
    }
    if (status === 'missing') earned = 0;
    var lower = line.toLowerCase(), cat = null;
    for (var i = 0; i < cats.length; i++) if (lower.indexOf(cats[i].name.toLowerCase()) >= 0) { cat = cats[i]; break; }
    if (!cat) {
      var guesses = [[/test|exam|assessment|summative/, /test|exam|assess|summative/], [/quiz/, /quiz/], [/lab/, /lab/], [/hw|homework/, /homework|hw/], [/essay|paper/, /essay|writing|paper/], [/project/, /project/]];
      for (var g = 0; g < guesses.length && !cat; g++) if (guesses[g][0].test(lower)) cat = cls.categories.find(function(c){ return guesses[g][1].test(c.name.toLowerCase()); }) || null;
    }
    if (!cat) cat = cls.categories[0] || null;
    var cells = line.split(/\t+|\s{2,}/).map(function(s){ return s.trim(); }).filter(Boolean);
    var name = cells.find(function(s){ return /[a-z]/i.test(s) && !/^(\d|\/|out of|missing|excused|graded|not graded|points?|raw score|percent)/i.test(s) && !(cat && s.toLowerCase() === cat.name.toLowerCase()); });
    if (!name) name = line.replace(last ? last[0] : '', ' ').replace(/\s+/g, ' ').trim();
    out.push({ name: (name || 'Untitled').replace(/\s+/g, ' ').slice(0, 80), earned: earned, possible: possible, date: date, catId: cat ? cat.id : null, status: status });
  });
  return out;
}

      applyBB(data);
      var n = data.classes.length, a = data.classes.reduce(function(t, c){ return t + (c.assignments || []).length; }, 0);
      $('.sheet-body', root).innerHTML = '<div class="empty" style="padding:44px 20px"><span class="ring ring-sm" style="width:64px;height:64px;' + gstyle('A') + '"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="trk" cx="20" cy="20" r="16" stroke-width="4"/><circle class="prg intro" cx="20" cy="20" r="16" stroke-width="4" stroke-dasharray="100.53" stroke-dashoffset="0" style="--c:100.53"/></svg><svg viewBox="0 0 24 24" style="position:relative;transform:none;width:28px;height:28px;color:var(--t-a)"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
        '<h2 style="font-size:20px;margin-top:10px">Grades Updated</h2><p>' + n + ' classes and ' + a + ' assignments from Blackbaud.</p></div>';
      btn.style.visibility = 'hidden'; $('.sheet-bar .bar-btn', root).textContent = 'Done';
      setTimeout(function(){ if ($('#sheet').contains(root.firstChild)) { closeSheet(); } go('home'); }, 1500);
    };
    var check = function(){
      data = parseBB(ta.value); btn.disabled = !(data && data.classes.length);
      if (!ta.value.trim()) { $('#bb-prev', root).innerHTML = ''; return; }
      if (!data) { $('#bb-prev', root).innerHTML = '<p class="err">That isn’t from Gradecast Sync. On Blackbaud, tap Gradecast Sync and Send to Gradecast, then paste here.</p>'; return; }
      if (!data.classes.length) { $('#bb-prev', root).innerHTML = '<p class="err">Gradecast Sync didn’t find any classes. Open your Progress page on Blackbaud and run it again.</p>'; return; }
    };
    ta.addEventListener('input', check);
    ta.addEventListener('paste', function(){ setTimeout(function(){ check(); finish(); }, 0); });
    btn.addEventListener('click', function(){ check(); finish(); });
    if (prefill) { ta.value = prefill; check(); finish(); }
    else setTimeout(function(){ try { ta.focus({ preventScroll:true }); } catch (e) {} }, 60);
  }});
}

/* ---------- routing ---------- */
function parseHash(){
  var h = (location.hash || '').replace(/^#/, '');
  if (h.indexOf('class-') === 0 && getClass(h.slice(6))) return { view:'class', id: h.slice(6) };
  if (h === 'preferences') return { view:'prefs' };
  if (h === 'import') return { view:'home', importNow:true };
  return { view:'home' };
}
function render(){
  var r = parseHash(), changed = r.view !== ui.view || r.id !== ui.classId, prev = ui.view;
  ui.view = r.view; ui.classId = r.id || null;
  if (r.view === 'class') renderClass(r.id); else if (r.view === 'prefs') renderPrefs(); else renderHome();
  if (changed) window.scrollTo(0, 0);
  if (r.importNow && !ui.importShown) { ui.importShown = true; setTimeout(function(){ openBBImport(); }, 50); }
  if (changed && prev) { var m = $('#main'); m.classList.remove('view-fwd', 'view-back'); void m.offsetWidth; m.classList.add(r.view === 'home' ? 'view-back' : 'view-fwd'); }
  onScroll();
}
function go(h){ if ((location.hash || '').replace(/^#/, '') === h) render(); else location.hash = h; }
window.addEventListener('hashchange', render);
function onScroll(){ $('#navbar').classList.toggle('scrolled', window.scrollY > 40); }
window.addEventListener('scroll', onScroll, { passive:true });

/* ---------- actions ---------- */
var actions = {
  'go': function(el){ go(el.getAttribute('data-to')); },
  'sheet-close': closeSheet,
  'class-new': function(){ openClassSheet(null); },
  'class-edit': function(){ openClassSheet(getClass(ui.classId)); },
  'class-del': function(){ var c = getClass(ui.classId); alertBox('Delete ' + c.name + '?', 'This deletes the class and its ' + c.assignments.length + ' assignments.', 'Delete', function(){ state.classes = state.classes.filter(function(x){ return x !== c; }); save(); go('home'); }); },
  'cat-add': function(){ $('#cat-add').insertAdjacentHTML('beforebegin', catRow({ id: uid(), name:'', weight:'' })); var rows = $$('#cf-cats .cat-row'); $('[data-cf=name]', rows[rows.length - 1]).focus(); $('#class-form').dispatchEvent(new Event('input')); },
  'cat-del': function(el){ if ($$('#cf-cats .cat-row').length <= 1) return; el.closest('.cat-row').remove(); $('#class-form').dispatchEvent(new Event('input')); },
  'as-new': function(){ openAssignmentSheet(null); },
  'as-edit': function(el){ var a = getClass(ui.classId).assignments.find(function(x){ return x.id === el.getAttribute('data-id'); }); if (a) openAssignmentSheet(a); },
  'as-del': function(){ var cls = getClass(ui.classId), id = $('#as-form')._id; cls.assignments = cls.assignments.filter(function(a){ return a.id !== id; }); save(); closeSheet(); renderClass(ui.classId); },
  'as-paste': openPasteSheet,
  'try-examples': function(){ state.classes = sampleClasses(); state.example = true; state.onboarded = true; ui.homeIntro = true; save(); render(); },
  'bb-setup': openBBSetup,
  'bb-import': openBBImport,
  'bm-click': function(){ var a = $('#bm-area'); if (a) a.innerHTML = '<p class="sec-f">Don’t click it here. Drag it to your bookmarks bar, then click it while you’re on Blackbaud.</p>'; },
  'bm-copy': function(){
    var btn = $('#bm-copy');
    var fallback = function(){ $('#bm-area').innerHTML = '<div style="margin-top:12px"><textarea class="paste" id="bm-text" readonly aria-label="Sync code">' + esc(BOOKMARKLET) + '</textarea><p class="sec-f">Select all and copy.</p></div>'; var t = $('#bm-text'); t.focus(); t.select(); };
    try { navigator.clipboard.writeText(BOOKMARKLET).then(function(){ btn.textContent = 'Copied'; setTimeout(function(){ if (btn.isConnected) btn.textContent = 'Copy Sync Code'; }, 1800); }, fallback); } catch (e) { fallback(); }
  },
  'clear-examples': function(){ alertBox('Clear Example Classes?', 'Your grading scale stays.', 'Clear', function(){ state.classes = []; state.example = false; state.onboarded = false; save(); render(); }); },
  'band-add': function(){ scale().bands.push({ letter:'?', min:0, gpa:0 }); save(); renderPrefs(); },
  'band-del': function(el){ var s = scale(); if (s.bands.length <= 1) return; s.bands.splice(+el.getAttribute('data-i'), 1); save(); renderPrefs(); },
  'backup-copy': function(){
    var code = JSON.stringify(state), btn = $('#backup-btn');
    var fallback = function(){ $('#backup-area').innerHTML = '<div style="margin-top:12px"><textarea class="paste" id="backup-text" readonly aria-label="Backup code">' + esc(code) + '</textarea><p class="sec-f">Select all and copy.</p></div>'; var t = $('#backup-text'); t.focus(); t.select(); };
    try { navigator.clipboard.writeText(code).then(function(){ btn.textContent = 'Copied'; setTimeout(function(){ if (btn.isConnected) btn.textContent = 'Copy Backup Code'; }, 1800); }, fallback); } catch (e) { fallback(); }
  },
  'restore-open': function(){
    openSheet('Restore', '<div class="sec"><textarea class="paste" id="restore-text" placeholder="Paste your backup code." aria-label="Backup code"></textarea><p class="sec-f">This replaces the classes on this device.</p></div><p class="err" id="restore-err" role="alert"></p>', { done:'Restore', mount: function(root){
      $('#sheet-done', root).addEventListener('click', function(){
        var s; try { s = JSON.parse($('#restore-text').value); } catch (e) { $('#restore-err').textContent = 'That isn’t a backup code. Paste the whole thing.'; return; }
        if (!valid(s)) { $('#restore-err').textContent = 'That backup is missing its classes or scale.'; return; }
        state = normalize(s); save(); closeSheet(); go('home');
      });
    }});
  },
  'reset': function(){ alertBox('Delete All Data?', 'Every class and assignment on this device will be deleted.', 'Delete', function(){ state = freshState(false); save(); go('home'); }); }
};
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var fn = actions[el.getAttribute('data-act')]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
document.addEventListener('paste', function(e){
  var t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  var text = (e.clipboardData || window.clipboardData).getData('text'); if (!parseBB(text)) return;
  e.preventDefault(); openBBImport(text);
});
document.addEventListener('pointerdown', function(e){ if (e.target.id === 'sim-range') { pv.down = true; previewPing(); refreshSim(); } });
function endDrag(){ if (pv.down) { pv.down = false; previewPing(); } }
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

document.addEventListener('input', function(e){
  var t = e.target;
  if (ui.view === 'class') {
    var cls = getClass(ui.classId); if (!cls) return; var sim = simFor(cls);
    if (/^sim-(range|score|pos)$/.test(t.id)) previewPing();
    if (t.id === 'sim-range') { sim.score = +t.value; $('#sim-score').value = pts(sim.score); refreshSim(); }
    else if (t.id === 'sim-score') { var v = num(t.value); if (v != null && v >= 0) { sim.score = v; refreshSim(); } }
    else if (t.id === 'sim-pos') { var p = num(t.value); if (p != null && p >= 0) { var ratio = sim.possible > 0 ? sim.score / sim.possible : .9; sim.possible = p; sim.score = Math.round(p * ratio * 100) / 100; $('#sim-score').value = pts(sim.score); refreshSim(); } }
    return;
  }
  if (ui.view === 'prefs') {
    if (t.id === 'p-test') { updateTest(); return; }
    if (t.hasAttribute('data-bf')) {
      var b = scale().bands[+t.getAttribute('data-i')], f = t.getAttribute('data-bf');
      if (f === 'letter') { b.letter = t.value; var d = t.parentNode.querySelector('.dot'); if (d) d.setAttribute('style', gstyle(t.value)); }
      else { var n = num(t.value); if (n != null) b[f] = n; }
      save(); updateTest(); return;
    }
    if (t.id === 'gpa-h' && num(t.value) != null) { state.gpa.honors = num(t.value); save(); }
    if (t.id === 'gpa-ap' && num(t.value) != null) { state.gpa.ap = num(t.value); save(); }
  }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (ui.view === 'class' && t.id === 'sim-cat') { simFor(getClass(ui.classId)).catId = t.value; previewPing(); refreshSim(); return; }
  if (ui.view === 'prefs') {
    if (t.id === 'p-round') { scale().rounding = t.value; save(); updateTest(); return; }
    if (t.getAttribute('data-bf') === 'min') { renderPrefs(); return; }
    if (t.id === 'p-preset' && t.value) {
      var k = t.value; t.value = '';
      alertBox('Replace Grading Scale?', 'Your letter cutoffs will be replaced with ' + PRESETS[k].name + '.', 'Replace', function(){
        var s = scale(); s.bands = clone(PRESETS[k].bands); s.rounding = PRESETS[k].rounding; save(); renderPrefs();
      });
    }
  }
});

window.__gradecast = { bookmarklet: function(){ return BOOKMARKLET; }, parseBB: parseBB, compute: compute, letterOf: letterOf, needFor: needFor, parsePaste: parsePaste, effCut: effCut, PRESETS: PRESETS, state: function(){ return state; } };
render();
})();
</script>
</body>
